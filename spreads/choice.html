<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>选择牌阵 · Choice Spread</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="spread-wrap">
    <div class="spread-header" style="width: 400px;">
        选择牌阵 · Choice
    </div>
    <!-- A V: two arms diverging upward from a shared starting card at the bottom.
         Mirrored cards share the same --dx magnitude with opposite sign. -->
    <div class="spread-canvas" style="width: 540px; height: 540px;">
        <!-- Centred viewBox (canvas 540x540): SVG units are offsets from the
             centre, matching the cards' --dx / --dy. -->
        <svg class="spread-lines" viewBox="-270 -270 540 540">
            <!-- Left arm: card 1 up through 2, 4, 6 -->
            <line x1="0" y1="150" x2="-120" y2="-150"
                  style="stroke:#b0c4de; stroke-width:3; stroke-dasharray:4;" />
            <!-- Right arm: card 1 up through 3, 5, 7 -->
            <line x1="0" y1="150" x2="120" y2="-150"
                  style="stroke:#b0c4de; stroke-width:3; stroke-dasharray:4;" />
        </svg>
        <div class="card" style="--dx: -120px; --dy: -150px;"> 6 <span class="label label--left">A选择的未来</span></div>
        <div class="card" style="--dx:  -80px; --dy:  -50px;"> 4 <span class="label label--left">A选择的结果</span></div>
        <div class="card" style="--dx:  -40px; --dy:   50px;"> 2 <span class="label label--left">A选择的状况</span></div>
        <div class="card" style="--dx:    0px; --dy:  150px;"> 1 <span class="label label--bottom">现状出发点</span></div>
        <div class="card" style="--dx:   40px; --dy:   50px;"> 3 <span class="label label--right">B选择的状况</span></div>
        <div class="card" style="--dx:   80px; --dy:  -50px;"> 5 <span class="label label--right">B选择的结果</span></div>
        <div class="card" style="--dx:  120px; --dy: -150px;"> 7 <span class="label label--right">B选择的未来</span></div>
    </div>
</div>

</body>
</html>
